name: Draw Git Koi

on:
  schedule:
    - cron: '5 0 * * *' # Runs daily shortly after midnight UTC
  workflow_dispatch:

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit koi if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update git-koi animation" && git push)

